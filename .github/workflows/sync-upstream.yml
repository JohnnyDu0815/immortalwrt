name: Sync Upstream ImmortalWrt

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          ref: openwrt-25.12
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_TOKEN }}   # 使用 PAT

      - name: Sync from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git || true
          git fetch upstream openwrt-25.12
          
          git merge --no-ff upstream/openwrt-25.12 -m "Merge upstream openwrt-25.12 ($(date +%Y-%m-%d))" || {
            echo "❌ 有合并冲突，需要手动解决！"
            exit 1
          }
          
          git push origin openwrt-25.12
